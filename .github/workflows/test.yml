name: Portable installer tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -X utf8 install.py verify
      - run: python -X utf8 -m unittest test_install
      - run: python -X utf8 -m unittest discover -s skill/scripts -p "test_*.py"
